name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # 语法闸门：先挡住明显的解析错误，比等测试报错快
      - name: 语法检查
        run: |
          node --check server.mjs
          find src tests -name '*.js' -print0 | xargs -0 -n1 node --check

      # 1069 项测试 + 分层覆盖率门槛（vite.config.js 里的 thresholds：
      # 全局基线只许升不许降，核心层 ≥95%）
      - name: 测试与覆盖率
        run: npm run test:cov

      # 裸插值棘轮 = 0；raw() 白名单；SafeHtml 契约；main.js 副作用引入。
      # 这些都在 tests/html-template.test.js 里，随上面的 vitest 跑，不重复。
      #
      # 单独一步只是为了让失败时日志里一眼看到「是模板防线挂了」
      - name: 模板防线（单独列出，失败时更醒目）
        run: npx vitest run tests/html-template.test.js
