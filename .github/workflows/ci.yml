# CI：方案 E03 的第一批门禁（基础检查 → 离线测试 → 构建一致性）
#
# 设计取舍：
#   · 只用 GitHub 托管 runner，不连真网络数据源 —— 上游断连不该阻塞代码提交；
#     真实来源探活属于单独的手动/定时作业（见 docs 方案 §6.3）。
#   · 测试进程统一 `DISABLE_BACKGROUND=1` + 临时数据目录，避免 CI 里偷偷抓外网。
#   · 构建用 `verify:build` 而不是 `build`：它比对文件集合与摘要，能抓出
#     「改了源码忘了重新构建」「旧产物残留」这两类问题。
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24.21.0']
    env:
      DISABLE_BACKGROUND: '1'
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - name: 读取 .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}
          cache: npm

      - name: 环境预检
        run: node tools/doctor.mjs

      - name: 安装依赖
        run: npm ci

      - name: 单元与集成测试
        run: npm test

      - name: 覆盖率门禁
        run: npm run test:cov

      - name: 构建一致性
        run: npm run verify:build

      # 发布包：白名单收集 → 解压到全新临时目录 → 起真进程 → 三个入口都 200
      - name: 发布包冒烟
        run: npm run pack
