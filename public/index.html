<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>市场看板 · 金价 / 比特币 / 原油 / 美股 / 上证</title>
  <!-- 前端依赖的 bare specifier 解析表。
       浏览器原生加载 ES 模块，没有构建期改写，所以裸模块名必须在这里声明。
       产物由 `npm run build` 生成并入库（见 README「依赖策略」）：
         vendor/geo-kit.js    → 地图的 d3 地理/相机栈 + world-atlas 拓扑（177 国）
         vendor/macro-flow.js → #/macro 传导图谱（X6 + dagre，按需 import()）
       import map 必须出现在任何 type="module" 脚本之前，否则浏览器直接报解析错误。 -->
  <script type="importmap">
    {
      "imports": {
        "geo-kit": "/vendor/geo-kit.js",
        "ui-kit": "/vendor/ui-kit.js"
      }
    }
  </script>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1017'/%3E%3Cpath d='M6 22l6-7 5 4 9-11' stroke='%23f5455c' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
  />
  <!-- 样式按主题拆成 11 个文件，加载顺序 = 原 styles.css 的从上到下顺序（级联结果不变）。
       顺序有强约束：tokens 必须最先；responsive / wide-screen 必须在 ticker-list 之后（同优先级覆盖列表布局）。 -->
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/workspace.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/ticker-list.css" />
  <link rel="stylesheet" href="./styles/responsive.css" />
  <link rel="stylesheet" href="./styles/detail.css" />
  <link rel="stylesheet" href="./styles/macro-matrix.css" />
  <link rel="stylesheet" href="./styles/events.css" />
  <link rel="stylesheet" href="./styles/worldmap.css" />
  <link rel="stylesheet" href="./styles/wide-screen.css" />
  <link rel="stylesheet" href="./styles/recap.css" />
  <link rel="stylesheet" href="./styles/macro-graph.css" />
  <link rel="stylesheet" href="./styles/explanations.css" />
  <!-- 任务导航（.tasks/.task-group/.task-label）的样式在这里，别漏 -->
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="pulse" aria-hidden="true"></span>
      <h1>市场看板</h1>
      <span class="tag">23 标的 · 跨资产宏观终端</span>
    </div>
    <!-- 导航收敛（产品 §3.2）：三个任务，深链接全部保留；任务只是分组，不是中间页 -->
    <nav class="status tasks" id="tasks" aria-label="任务">
      <div class="task-group" data-task="today">
        <span class="task-label">今日理解</span>
        <a class="nav-link" data-nav-hash="" href="#">市场行情</a>
        <a class="nav-link" data-nav-hash="#/events" href="#/events">事件中心</a>
      </div>
      <div class="task-group" data-task="explore">
        <span class="task-label">探索关系</span>
        <a class="nav-link" data-nav-hash="#/map" href="#/map">全球地图</a>
        <a class="nav-link" data-nav-hash="#/macro" href="#/macro">关联分析</a>
      </div>
      <div class="task-group" data-task="watch">
        <span class="task-label">我的关注</span>
        <a class="nav-link" data-nav-hash="#/watch" href="#/watch">今天重点</a>
      </div>
      <button id="briefing-btn" type="button" class="nav-link btn-link" title="A股收盘后，隔夜各资产走了多少">隔夜复盘</button>
      <!-- 状态簇打包成一个 flex 项：窄屏换行时整组落到同一行，而不是拆散 -->
      <span class="tasks-status">
        <span id="updated" class="updated">连接中…</span>
        <span id="countdown" class="muted"></span>
        <!-- P4-T1：全局命令面板与智能预警中心入口。未读徽章由 alerts-panel.js 维护 -->
        <button id="cmd-palette-btn" type="button" class="nav-link btn-link" aria-label="打开命令面板与搜索（⌘K）" title="搜索标的 / 视图 / 工作台动作（⌘K）">⌘K 搜索</button>
        <button id="alerts-btn" type="button" class="nav-link btn-link" title="智能预警中心：规则与最近触发">预警中心<span id="alerts-unread" class="al-unread" hidden></span></button>
        <button id="refresh" type="button" title="立即刷新（快捷键 R）">刷新</button>
      </span>
    </nav>
  </header>

  <!-- P2-T2 工作台控制条：视图 / 交易状态筛选 / 显示设置 -->
  <div id="ws-bar" class="ws-bar-host"></div>

  <!-- P2-T3 四大宏观合成指标（/api/quotes.synthetics） -->
  <div id="synthetics-strip" class="synthetics-strip" aria-live="polite"></div>

  <main id="rows" class="rows" aria-live="polite" aria-busy="true"></main>

  <!-- 今日异动解读（默认折叠并置于行情墙下方，按需展开，不干扰行情首屏） -->
  <section id="questions" class="questions" aria-live="polite" hidden></section>

  <!-- 独立「今天重点 / 我的自选」视图（#/watch）：自选行情 + 宏观重点 + 关注简报/台账/生活连接 -->
  <section id="watch" class="watch-view" hidden aria-live="polite">
    <div id="watch-content"></div>
    <section id="home-brief" class="home-brief watch-brief-host" hidden></section>
  </section>

  <section id="detail" class="detail" hidden aria-live="polite"></section>

  <section id="macro" class="macro" hidden aria-live="polite"></section>

  <section id="events" class="events" hidden aria-live="polite"></section>

  <section id="map" class="map" hidden aria-live="polite"></section>

  <footer class="foot">
    <span>数据源：新浪财经 · 东方财富 · Binance · Coinbase · gold-api</span>
    <span id="source-note" class="muted">非交易时段显示最近成交/收盘价</span>
  </footer>

  <script src="./app.js" type="module"></script>
</body>
</html>
